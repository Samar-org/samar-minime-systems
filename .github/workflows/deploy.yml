name: Deployment preflight (not enabled)

# The legacy Kubernetes scaffold contained invalid expressions and did not target
# the authorized existing Droplet. This manual preflight has no deployment grants.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to assess
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  release-gate:
    name: Report unresolved release prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unverified deployment
        run: |
          echo 'Deployment is unavailable: verified Droplet SSH access, pinned host identity,'
          echo 'project/environment authorization, HQ ledger bridge, SOPS runtime injection,'
          echo 'exact-artifact evidence, rollback and release approval are not connected.'
          echo 'This workflow does not deploy or read infrastructure credentials.'
          exit 1
